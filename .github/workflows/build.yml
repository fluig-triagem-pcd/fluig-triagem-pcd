name: Compilar componente Fluig

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Compilar (Maven)
        run: mvn -B clean install

      - name: Guardar o .ear e o .war
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-fluig
          path: |
            **/target/*.ear
            **/target/*.war
          if-no-files-found: error
