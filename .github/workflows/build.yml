name: Compilar componente Fluig

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 11 e configurar acesso ao Nexus
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: nexus
          server-username: NEXUS_USER
          server-password: NEXUS_PASS

      - name: Gerar credenciais OAuth da API (a partir dos Secrets)
        run: |
          D=api-start-public-process/api-rest-start-public-process/src/main/resources
          mkdir -p "$D"
          {
            echo "base.url=${FLUIG_BASE_URL}"
            echo "consumer.key=${FLUIG_CONSUMER_KEY}"
            echo "consumer.secret=${FLUIG_CONSUMER_SECRET}"
            echo "token=${FLUIG_TOKEN}"
            echo "token.secret=${FLUIG_TOKEN_SECRET}"
          } > "$D/fluig-oauth.properties"
        env:
          FLUIG_BASE_URL: ${{ secrets.FLUIG_BASE_URL }}
          FLUIG_CONSUMER_KEY: ${{ secrets.FLUIG_CONSUMER_KEY }}
          FLUIG_CONSUMER_SECRET: ${{ secrets.FLUIG_CONSUMER_SECRET }}
          FLUIG_TOKEN: ${{ secrets.FLUIG_TOKEN }}
          FLUIG_TOKEN_SECRET: ${{ secrets.FLUIG_TOKEN_SECRET }}

      - name: Compilar (Maven)
        run: mvn -B clean install
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

      - name: Guardar o .ear e o .war
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-fluig
          path: |
            **/target/*.ear
            **/target/*.war
          if-no-files-found: error
